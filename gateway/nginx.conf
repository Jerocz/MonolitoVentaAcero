# API Gateway (Nginx) - unico punto de entrada publico del ecosistema (puerto 80).
#
#   /api/catalogo/*     -> ms-catalogo     (Flask)  solo lectura desde Internet
#   /api/fabricacion/*  -> ms-fabricacion  (Flask)  solo lectura desde Internet
#   /api/pagos/health   -> ms-pagos        (Flask)  el resto de pagos es privado
#   /api/*, /*          -> monolito Django (Strangler: lo que aun no se migro)
#   /static/, /media/   -> archivos servidos directamente por Nginx
#
# Las escrituras hacia los microservicios (reservar stock, cobrar, crear ordenes)
# solo las hace el monolito por la red interna de Docker, nunca desde afuera.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 30s;

    log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time upstream=$upstream_addr ust=$upstream_response_time '
                       'rid=$request_id';
    access_log /var/log/nginx/access.log gateway;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv;

    # Proteccion basica contra abuso: 20 peticiones/segundo por IP en la API.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # DNS interno de Docker. Con `resolve`, Nginx vuelve a consultar la IP de cada
    # contenedor; asi, si uno se recrea (nueva version, reinicio), el gateway no
    # queda apuntando a una IP vieja (502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream monolito       { zone up_monolito 64k;       server web:8000 resolve;            keepalive 16; }
    upstream ms_catalogo    { zone up_catalogo 64k;       server ms_catalogo:5000 resolve;    keepalive 8; }
    upstream ms_pagos       { zone up_pagos 64k;          server ms_pagos:5000 resolve;       keepalive 8; }
    upstream ms_fabricacion { zone up_fabricacion 64k;    server ms_fabricacion:5000 resolve; keepalive 8; }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 2m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        # Resiliencia: si un upstream falla en GET, se reintenta una vez.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location = /gateway/salud {
            default_type application/json;
            return 200 '{"servicio":"api-gateway-nginx","estado":"ok"}';
        }

        location /static/ {
            alias /srv/static/;
            expires 7d;
            access_log off;
        }

        location /media/ {
            alias /srv/media/;
        }

        # --------------------------------------------------- microservicios
        location /api/catalogo/ {
            limit_req zone=api burst=40 nodelay;
            limit_except GET { deny all; }
            add_header Access-Control-Allow-Origin "*" always;  # servicio publico para el equipo aliado
            proxy_intercept_errors on;
            error_page 502 503 504 = @servicio_no_disponible;
            proxy_pass http://ms_catalogo;
        }

        location /api/fabricacion/ {
            limit_req zone=api burst=40 nodelay;
            limit_except GET { deny all; }
            proxy_intercept_errors on;
            error_page 502 503 504 = @servicio_no_disponible;
            proxy_pass http://ms_fabricacion;
        }

        location = /api/pagos/health {
            proxy_intercept_errors on;
            error_page 502 503 504 = @servicio_no_disponible;
            proxy_pass http://ms_pagos;
        }

        location /api/pagos/ {
            default_type application/json;
            return 403 '{"error":"Acceso privado / Private access","codigo":"GATEWAY_PRIVADO"}';
        }

        # --------------------------------------------------- monolito (resto)
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_intercept_errors on;
            error_page 502 503 504 = @servicio_no_disponible;
            proxy_pass http://monolito;
        }

        location / {
            proxy_pass http://monolito;
        }

        location @servicio_no_disponible {
            default_type application/json;
            add_header Retry-After 10 always;
            return 503 '{"error":"Servicio temporalmente no disponible / Service temporarily unavailable","codigo":"GATEWAY_UPSTREAM"}';
        }
    }
}
